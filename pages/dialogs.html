    <dialog id="loginDialog" class="login-dialog">
      <form id="loginForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2>로그인</h2>
          </div>
          <button id="closeLogin" class="icon-btn" aria-label="닫기" type="button">&times;</button>
        </div>
        <div class="login-body">
          <label>아이디<input id="loginId" autocomplete="username" placeholder="아이디" /></label>
          <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" /></label>
          <button id="loginSubmit" class="primary-btn" value="default" type="submit">로그인</button>
          <p id="loginMessage"></p>
        </div>
      </form>
    </dialog>

    <dialog id="memberDialog" class="login-dialog">
      <form id="memberForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2 id="memberDialogTitle">회원 추가</h2>
          </div>
          <button id="closeMemberDialog" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body">
          <label>아이디<input id="memberId" autocomplete="off" placeholder="아이디" /></label>
          <label id="memberPasswordLabel">
            <span id="memberPasswordTitle">비밀번호</span>
            <input id="memberPassword" type="password" autocomplete="new-password" placeholder="알파벳+숫자+특수문자 8자 이상" />
          </label>
          <label id="memberPasswordConfirmWrap" class="hidden">
            <span>비밀번호 확인</span>
            <input id="memberPasswordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호 확인" />
          </label>
          <label>이름<input id="memberName" autocomplete="off" placeholder="이름" /></label>
          <label>부서
            <select id="memberDepartment" class="member-dialog-select"></select>
          </label>
          <div class="member-inline-fields">
            <label>권한
              <select id="memberRole" class="member-dialog-select">
                <option value="user">일반</option>
                <option value="admin">관리자</option>
              </select>
            </label>
            <label>계정 상태
              <select id="memberApproval" class="member-dialog-select">
                <option value="비활성화">비활성화</option>
                <option value="활성화">활성화</option>
              </select>
            </label>
          </div>
          <button id="memberSubmitBtn" class="primary-btn" type="submit">등록</button>
          <p id="memberMessage"></p>
        </div>
      </form>
    </dialog>

    <dialog id="statusDialog" class="login-dialog">
      <form id="statusForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2>상태 변경</h2>
            <p id="statusProjectName">선택한 프로젝트의 상태를 변경합니다.</p>
          </div>
          <button id="closeStatus" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body">
          <label>상태값
            <select id="statusSelect"></select>
          </label>
          <button class="primary-btn" type="submit">변경</button>
          <p>작업상태 목록에서 선택한 값으로 변경됩니다.</p>
        </div>
      </form>
    </dialog>

    <dialog id="leaveDialog" class="login-dialog">
      <form id="leaveForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2>연차 등록</h2>
          </div>
          <button id="closeLeaveDialog" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body">
          <label id="leaveUserField" class="hidden">회원
            <select id="leaveUserId" class="member-dialog-select"></select>
          </label>
          <label>시작일
            <input id="leaveStartDate" type="date" required />
          </label>
          <label>종료일
            <input id="leaveEndDate" type="date" required />
          </label>
          <div class="member-inline-fields">
            <label>구분
              <select id="leaveType" class="member-dialog-select">
                <option value="연차">연차</option>
                <option value="오전 반차">오전 반차</option>
                <option value="오후 반차">오후 반차</option>
              </select>
            </label>
            <label>차감 일수
              <input id="leaveDays" type="number" min="0.5" max="30" step="0.5" value="1" />
            </label>
          </div>
          <label>사유
            <input id="leaveReason" autocomplete="off" maxlength="120" placeholder="연차 사유" />
          </label>
          <button class="primary-btn" type="submit">등록</button>
          <p id="leaveMessage"></p>
        </div>
      </form>
    </dialog>

    <dialog id="shortcutDialog" class="login-dialog">
      <form id="shortcutForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2 id="shortcutDialogTitle">홈페이지 URL 등록</h2>
            <p id="shortcutProjectName">프로젝트 URL을 등록하세요.</p>
          </div>
          <button id="closeShortcut" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body">
          <label>URL
            <input id="shortcutUrlInput" type="text" placeholder="https://example.com" required />
          </label>
          <button class="primary-btn" type="submit">등록 후 이동</button>
          <p>등록된 URL은 프로젝트 상세에서도 수정할 수 있습니다.</p>
        </div>
      </form>
    </dialog>

    <dialog id="scheduleDialog" class="login-dialog schedule-dialog">
      <form id="scheduleForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2 id="scheduleDialogTitle">일정 추가</h2>
            <p id="scheduleDialogDate">일정을 등록합니다.</p>
          </div>
          <button id="closeScheduleDialog" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body schedule-dialog-body">
          <label>일자
            <input id="scheduleDateInput" type="date" required />
          </label>
          <label id="scheduleProjectField">프로젝트
            <div id="scheduleProjectPicker" class="schedule-project-picker">
              <input id="scheduleProjectSearch" type="search" placeholder="프로젝트명 또는 PJ No 검색" autocomplete="off" />
              <input id="scheduleProjectId" type="hidden" />
              <div id="scheduleProjectResults" class="schedule-project-results" role="listbox" hidden></div>
            </div>
          </label>
          <div id="scheduleAssignFields" class="schedule-assign-fields hidden">
            <label>마일스톤
              <select id="scheduleMilestoneSelect" class="schedule-dialog-input"></select>
            </label>
            <div class="schedule-staff-row">
              <label>담당 역할
                <select id="scheduleStaffRoleSelect" class="schedule-dialog-input">
                  <option value="PM">PM</option>
                  <option value="디자이너">디자이너</option>
                  <option value="퍼블리셔">퍼블리셔</option>
                  <option value="프로그래머">프로그래머</option>
                </select>
              </label>
              <label>담당자
                <input id="scheduleStaffNameInput" class="schedule-dialog-input" type="text" placeholder="담당자명 입력" maxlength="40" />
              </label>
            </div>
          </div>
          <label>상세
            <input id="scheduleDetailInput" class="schedule-dialog-input" type="text" placeholder="일정 상세 내용 입력" maxlength="120" required />
          </label>
          <label id="scheduleCompletedField" class="check-option schedule-completed-field hidden">
            <input id="scheduleCompletedInput" type="checkbox" />
            완료
          </label>
          <div class="schedule-dialog-actions">
            <button id="scheduleProjectDetailButton" class="ghost-btn hidden" type="button">프로젝트 상세</button>
            <button id="scheduleSubmitButton" class="primary-btn" type="submit">일정 추가</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="downloadDialog" class="login-dialog">
      <form id="downloadForm" class="login-card">
        <div class="panel-head">
          <div>
            <h2>데이터 다운로드</h2>
            <p>다운로드할 파일 형식을 선택하세요.</p>
          </div>
          <button id="closeDownload" class="icon-btn" aria-label="닫기" type="button">×</button>
        </div>
        <div class="login-body">
          <label class="check-option">
            <input name="downloadType" type="radio" value="excel" checked />
            엑셀 (프로젝트 상세)
          </label>
          <label class="check-option">
            <input name="downloadType" type="radio" value="json" />
            JSON (전체 데이터)
          </label>
          <p>엑셀은 프로젝트 상세 항목만, JSON은 DB 이관용 전체 데이터를 내려받습니다.</p>
          <button class="primary-btn" type="submit">다운로드</button>
        </div>
      </form>
    </dialog>

    <datalist id="statusList"></datalist>
    <datalist id="milestoneList"></datalist>
