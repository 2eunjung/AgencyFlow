      <section id="vacationScheduleView" class="view">
        <div class="list-panel schedule-panel">
          <div class="panel-head">
            <div>
              <h1>휴가 일정</h1>
            </div>
          </div>

          <div class="schedule-content">
            <input id="vacationViewCalendar" class="schedule-mode-input" type="radio" name="vacationScheduleViewMode" checked />
            <input id="vacationViewList" class="schedule-mode-input" type="radio" name="vacationScheduleViewMode" />

            <div class="schedule-toolbar">
              <div class="schedule-view-tabs" role="tablist" aria-label="휴가 일정 보기 방식">
                <label class="schedule-view-tab" for="vacationViewCalendar" role="tab">캘린더</label>
                <label class="schedule-view-tab" for="vacationViewList" role="tab">리스트</label>
              </div>
              <div class="filters schedule-filters">
                <input id="vacationSearchInput" type="search" placeholder="부서, 이름, 휴가 구분 검색" autocomplete="off" />
              </div>
            </div>

            <div class="admin-only hidden" id="companyHolidayForm">
              <div class="filters schedule-filters">
                <input id="companyHolidayDate" type="date" />
                <input id="companyHolidayTitle" type="text" placeholder="회사 휴일명" autocomplete="off" />
                <button class="ghost-btn" id="companyHolidayAddBtn" type="button">회사 휴일 추가</button>
              </div>
            </div>

            <div class="schedule-calendar-wrap" id="vacationCalendarPanel">
              <div class="schedule-calendar-head">
                <div class="schedule-calendar-nav">
                  <button class="ghost-btn schedule-nav-btn" id="vacationPrevMonth" type="button" aria-label="이전 달">‹</button>
                  <strong class="schedule-month-label" id="vacationMonthLabel">2026년 7월</strong>
                  <button class="ghost-btn schedule-nav-btn" id="vacationNextMonth" type="button" aria-label="다음 달">›</button>
                </div>
              </div>
              <div class="schedule-calendar-grid" id="vacationCalendarGrid" aria-label="휴가 일정 캘린더"></div>
            </div>

            <div class="schedule-list-wrap" id="vacationListPanel">
              <div class="schedule-list-toolbar">
                <div class="schedule-list-period">
                  <input id="vacationListMonth" class="schedule-period-input" type="radio" name="vacationListPeriod" checked />
                  <input id="vacationListWeek" class="schedule-period-input" type="radio" name="vacationListPeriod" />
                  <div class="schedule-list-period-tabs" role="tablist" aria-label="리스트 기간">
                    <label class="schedule-list-period-tab" for="vacationListMonth" role="tab">월별</label>
                    <label class="schedule-list-period-tab" for="vacationListWeek" role="tab">주별</label>
                  </div>
                  <div class="schedule-list-nav">
                    <button class="ghost-btn schedule-nav-btn" id="vacationListPrev" type="button" aria-label="이전 기간">‹</button>
                    <strong class="schedule-month-label" id="vacationListPeriodLabel">2026년 7월</strong>
                    <button class="ghost-btn schedule-nav-btn" id="vacationListNext" type="button" aria-label="다음 기간">›</button>
                  </div>
                </div>
              </div>
              <div class="table-wrap schedule-table-wrap">
                <table class="schedule-list-table management-table">
                  <thead>
                    <tr>
                      <th>날짜</th>
                      <th>부서</th>
                      <th>이름</th>
                      <th>구분</th>
                      <th>상태</th>
                    </tr>
                  </thead>
                  <tbody id="vacationScheduleRows"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
