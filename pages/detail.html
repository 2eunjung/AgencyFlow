          <form id="detailForm" class="detail-panel">
            <div class="panel-head detail-title">
            <div>
              <div class="detail-heading-row">
                <h2 id="detailHeading">프로젝트 상세</h2>
                <span id="detailBadges" class="detail-badges"></span>
              </div>
              <p id="saveState">선택한 프로젝트를 수정하고 저장하세요.</p>
            </div>
              <div class="detail-actions">
                <input id="quoteFile" class="hidden-file" type="file" accept="application/pdf" />
                <button id="projectCompleteAction" class="ghost-btn project-complete-action hidden" type="button">완료</button>
                <label id="issueCheckLabel" class="detail-issue-check" title="이슈 체크">
                  <input id="hasIssue" type="checkbox" />
                  <span>이슈</span>
                </label>
                <label id="monthlyCollectionLabel" class="detail-issue-check" title="당월수금 체크">
                  <input id="monthlyCollection" type="checkbox" />
                  <span>당월수금</span>
                </label>
                <button id="shortcutAction" class="detail-icon-btn" type="button" aria-label="홈페이지" title="홈페이지 URL 등록">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </button>
                <button id="intranetAction" class="detail-icon-btn intranet-link" type="button" aria-label="인트라" title="인트라 URL 등록">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M9 6h.01"/><path d="M15 6h.01"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M9 14h.01"/><path d="M15 14h.01"/></svg>
                </button>
                <button id="designAction" class="detail-icon-btn design-link" type="button" aria-label="화면설계" title="화면설계 URL 등록">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="4" rx="1"/><rect x="14" y="10" width="7" height="11" rx="1"/><rect x="3" y="13" width="7" height="8" rx="1"/></svg>
                </button>
                <button id="quoteAction" class="detail-icon-btn" type="button" aria-label="견적서" title="견적서 등록">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
                </button>
                <button id="closeDetail" class="ghost-btn" type="button">닫기</button>
              </div>
            </div>

            <div id="detailSearchWrap" class="detail-search-wrap">
              <input id="detailSearchInput" type="search" placeholder="이슈, 소통내역 검색" autocomplete="off" />
            </div>

            <details class="detail-dropdown">
              <summary>
                <span>프로젝트 상세</span>
              </summary>
              <div class="detail-dropdown-body">
                <div class="form-grid detail-main-grid">
                  <label>PJ No<input id="projectNo" inputmode="numeric" pattern="[0-9]*" autocomplete="off" /></label>
                  <label>프로젝트명<input id="name" /></label>
                  <label>업종<input id="industry" /></label>
                  <span class="grid-spacer" aria-hidden="true"></span>

                  <label>계약일<input id="contractDate" type="date" /></label>
                  <label>납기일<input id="dueDate" type="date" /></label>
                  <label>오픈일자<input id="openDate" type="date" /></label>
                  <span class="grid-spacer" aria-hidden="true"></span>

                  <label>총 계약금액(만원, 부가세 포함)<input id="contractAmount" type="number" step="0.01" min="0" /></label>
                  <label>잔금(만원, 부가세 포함)<input id="balance" type="number" step="0.01" min="0" /></label>
                  <label>입금일<input id="depositDate" type="date" /></label>
                  <span class="grid-spacer" aria-hidden="true"></span>

                  <label>홈페이지 URL<input id="shortcutUrl" type="text" placeholder="https://" /></label>
                  <label>인트라 URL<input id="intranetUrl" type="text" placeholder="https://" /></label>
                  <label>화면설계 URL<input id="designUrl" type="text" placeholder="https://" /></label>
                  <span class="grid-spacer" aria-hidden="true"></span>

                  <label>마일스톤<select id="milestone"></select></label>
                  <label>작업상태<select id="status"></select></label>
                  <span class="grid-spacer" aria-hidden="true"></span>
                  <span class="grid-spacer" aria-hidden="true"></span>

                  <label>PM<input id="pm" /></label>
                  <label>디자이너<input id="designer" /></label>
                  <label>퍼블리셔<input id="publisher" /></label>
                  <label>프로그래머<input id="programmer" /></label>

                  <div class="choice-row">
                    <label class="check-option"><input name="hostingType" type="radio" value="일반 웹호스팅" /> 일반 웹호스팅</label>
                    <label class="check-option"><input name="hostingType" type="radio" value="단독서버" /> 단독서버</label>
                  </div>
                  <div class="choice-row">
                    <label class="check-option"><input name="hasLanding" type="radio" value="normal" /> 일반형</label>
                    <label class="check-option"><input name="hasLanding" type="radio" value="landing" /> 랜딩</label>
                  </div>
                  <label class="check-option choice-row">
                    <input id="hasForeignLanguage" type="checkbox" />
                    외국어
                  </label>
                </div>

                <div class="detail-contacts">
                  <div class="issue-head">
                    <h3>고객 담당자</h3>
                    <button id="addClientContact" class="ghost-btn" type="button">+ 담당자</button>
                  </div>
                  <div id="clientContactList" class="entry-list"></div>
                </div>
              </div>
            </details>

            <details class="detail-dropdown project-schedule-dropdown">
              <summary>
                <span class="detail-dropdown-title">프로젝트 일정</span>
                <button id="addProjectSchedule" class="ghost-btn project-schedule-add-btn" type="button">+ 일정 추가</button>
              </summary>
              <div class="detail-dropdown-body">
                <div class="detail-schedule-inner">
                  <div id="projectScheduleList" class="entry-list"></div>
                </div>
              </div>
            </details>

            <section class="subsection">
              <div class="issue-head">
                <h3>주요 이슈사항</h3>
                <button id="addIssue" class="ghost-btn" type="button">+ 이슈 추가</button>
              </div>
              <div id="issueList" class="issue-list"></div>
            </section>

            <section class="subsection">
              <div class="issue-head">
                <h3>소통내역</h3>
                <button id="addCommunication" class="ghost-btn" type="button">+ 소통내역</button>
              </div>
              <div id="communicationList" class="entry-list"></div>
            </section>

            <details class="detail-dropdown project-work-stack-dropdown">
              <summary>
                <span class="detail-dropdown-title">프로젝트 작업 스택</span>
              </summary>
              <div class="detail-dropdown-body">
                <div class="detail-schedule-inner">
                  <div id="projectWorkStackList" class="entry-list"></div>
                </div>
              </div>
            </details>

            <div class="sticky-actions">
              <button id="deleteProject" class="ghost-btn danger hidden" type="button">삭제</button>
              <button id="saveDetailBtn" class="primary-btn" type="button">저장</button>
            </div>
          </form>
