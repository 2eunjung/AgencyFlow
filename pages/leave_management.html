      <section id="leaveManagementView" class="view">

          <article class="summary-card">
            <span>총 연차</span>
            <strong id="leaveTotalDays">0</strong>
          </article>
          <article class="summary-card">
            <span>사용 연차</span>
            <strong id="leaveUsedDays">0</strong>
          </article>
          <article class="summary-card">
            <span>잔여 연차</span>

                <tr>

                  <th>상태</th>

                </tr>
              </thead>
              <tbody id="leaveRequestRows"></tbody>
            </table>
          </div>
        </div>
      </section>
